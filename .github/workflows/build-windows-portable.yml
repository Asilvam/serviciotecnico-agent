name: Build Windows portable agent

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Keep production dependencies
        run: npm prune --omit=dev

      - name: Create portable package
        shell: pwsh
        run: |
          ./packaging/windows/package-portable.ps1

      - name: Verify portable runtime
        shell: pwsh
        run: |
          Push-Location release/serviciotecnico-agent-windows-x64
          ./runtime/node.exe -e "['dotenv','pdfkit','qrcode','pdf-to-printer','socket.io-client','escpos','escpos-usb','usb','winston','winston-daily-rotate-file'].forEach(require.resolve); require('./dist/system-pdf-printer.js'); require('./dist/thermal-printer.js'); console.log('Portable runtime OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "El runtime portable no pudo cargar el agent."
          }
          Pop-Location

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: serviciotecnico-agent-windows-x64
          path: release/serviciotecnico-agent-windows-x64/
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "release/serviciotecnico-agent-windows-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive --clobber
          } else {
            gh release create $tag $archive --generate-notes
          }
